name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: devpilot
          POSTGRES_USER: devpilot
          POSTGRES_PASSWORD: devpilot
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U devpilot -d devpilot"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5434/devpilot
      SPRING_DATASOURCE_USERNAME: devpilot
      SPRING_DATASOURCE_PASSWORD: devpilot
      JWT_SECRET: ci-test-only-fake-jwt-secret-at-least-32-bytes
      OPENAI_API_KEY: ""
      GITHUB_CLIENT_ID: ""
      GITHUB_CLIENT_SECRET: ""
      GITHUB_TOKEN_ENCRYPTION_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B test
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_BASE_URL: /
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
