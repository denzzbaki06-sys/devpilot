spring.application.name=DevPilot
server.port=${SERVER_PORT:8083}

spring.datasource.url=jdbc:postgresql://localhost:5434/devpilot
spring.datasource.username=devpilot
spring.datasource.password=devpilot

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# Local development fallback only; set JWT_SECRET in deployed environments.
jwt.secret=${JWT_SECRET:devpilot-local-development-secret-change-me}
jwt.access-token-ttl=1h
jwt.refresh-token-ttl=7d
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
# Authentication is handled by AuthService/JWT; do not create a generated default user.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

github.client-id=${GITHUB_CLIENT_ID:}
github.client-secret=${GITHUB_CLIENT_SECRET:}
github.redirect-uri=${GITHUB_REDIRECT_URI:http://localhost:8083/api/github/callback}
# Base64-encoded 32-byte key; no development fallback for stored GitHub tokens.
github.token-encryption-key=${GITHUB_TOKEN_ENCRYPTION_KEY:}

devpilot.indexing.max-file-size-bytes=${INDEXING_MAX_FILE_SIZE_BYTES:500000}
devpilot.indexing.chunk-lines=${INDEXING_CHUNK_LINES:100}
devpilot.indexing.chunk-overlap-lines=${INDEXING_CHUNK_OVERLAP_LINES:15}
devpilot.indexing.max-files=${INDEXING_MAX_FILES:20000}
devpilot.indexing.max-total-bytes=${INDEXING_MAX_TOTAL_BYTES:50000000}
devpilot.indexing.max-line-length=${INDEXING_MAX_LINE_LENGTH:20000}
devpilot.indexing.max-chunks=${INDEXING_MAX_CHUNKS:100000}
devpilot.indexing.max-job-seconds=${INDEXING_MAX_JOB_SECONDS:1800}

devpilot.ai.embedding.provider=${EMBEDDING_PROVIDER:openai}
devpilot.ai.embedding.api-key=${OPENAI_API_KEY:}
devpilot.ai.embedding.base-url=${EMBEDDING_BASE_URL:https://api.openai.com/v1}
devpilot.ai.embedding.model=${EMBEDDING_MODEL:text-embedding-3-small}
devpilot.ai.embedding.dimensions=${EMBEDDING_DIMENSIONS:1536}
devpilot.ai.embedding.batch-size=${EMBEDDING_BATCH_SIZE:50}
devpilot.ai.embedding.max-retries=${EMBEDDING_MAX_RETRIES:3}
devpilot.ai.embedding.retry-delay-millis=${EMBEDDING_RETRY_DELAY_MILLIS:500}

devpilot.ai.chat.provider=${CHAT_PROVIDER:openai}
devpilot.ai.chat.api-key=${OPENAI_API_KEY:}
devpilot.ai.chat.base-url=${CHAT_BASE_URL:https://api.openai.com/v1}
devpilot.ai.chat.model=${CHAT_MODEL:gpt-5-mini}
devpilot.ai.chat.timeout-seconds=${CHAT_TIMEOUT_SECONDS:60}
devpilot.ai.rag.top-k=${RAG_TOP_K:8}
devpilot.ai.rag.max-context-chars=${RAG_MAX_CONTEXT_CHARS:30000}
devpilot.ai.rag.max-question-chars=${RAG_MAX_QUESTION_CHARS:4000}

# Explicit local frontend origin; set an origin allowlist for deployed environments.
devpilot.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# Browser OAuth callbacks redirect here; JSON clients retain their existing contract.
devpilot.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5174}

# Shared chat retries: transient 429/5xx/network only; never retry 400/401.
devpilot.ai.chat.retry.max-retries=${CHAT_MAX_RETRIES:2}
devpilot.ai.chat.retry.delay-millis=${CHAT_RETRY_DELAY_MILLIS:250}
devpilot.ai.review.max-files=${REVIEW_MAX_FILES:12}
devpilot.ai.review.max-diff-chars=${REVIEW_MAX_DIFF_CHARS:40000}
devpilot.ai.review.max-retrieved-chunks=${REVIEW_MAX_RETRIEVED_CHUNKS:24}
devpilot.ai.review.max-total-context-chars=${REVIEW_MAX_TOTAL_CONTEXT_CHARS:80000}
devpilot.ai.review.max-batch-chars=${REVIEW_MAX_BATCH_CHARS:16000}
devpilot.ai.review.max-batches=${REVIEW_MAX_BATCHES:8}
devpilot.ai.review.max-findings=${REVIEW_MAX_FINDINGS:40}
devpilot.ai.review.max-seconds=${REVIEW_MAX_SECONDS:300}

# Deterministic architecture analysis; no AI provider required.
devpilot.architecture.max-files=${ARCHITECTURE_MAX_FILES:300}
devpilot.architecture.max-source-chars=${ARCHITECTURE_MAX_SOURCE_CHARS:3000000}
devpilot.architecture.max-components=${ARCHITECTURE_MAX_COMPONENTS:1000}
devpilot.architecture.max-relationships=${ARCHITECTURE_MAX_RELATIONSHIPS:3000}

# Single-turn architecture intelligence; separate bounded context, shared RAG/provider.
devpilot.ai.architecture.max-question-chars=${ARCHITECTURE_ASK_MAX_QUESTION_CHARS:4000}
devpilot.ai.architecture.max-components=${ARCHITECTURE_ASK_MAX_COMPONENTS:24}
devpilot.ai.architecture.max-relationships=${ARCHITECTURE_ASK_MAX_RELATIONSHIPS:40}
devpilot.ai.architecture.depth=${ARCHITECTURE_ASK_DEPTH:1}
devpilot.ai.architecture.max-depth=${ARCHITECTURE_ASK_MAX_DEPTH:2}
devpilot.ai.architecture.top-k=${ARCHITECTURE_ASK_TOP_K:8}
devpilot.ai.architecture.max-chunks=${ARCHITECTURE_ASK_MAX_CHUNKS:12}
devpilot.ai.architecture.max-context-chars=${ARCHITECTURE_ASK_MAX_CONTEXT_CHARS:30000}
