services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: devpilot-postgres
    environment:
      POSTGRES_DB: devpilot
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-devpilot}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-devpilot}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - devpilot_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    image: devpilot-backend:1.1.0
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/devpilot}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-devpilot}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-devpilot}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env to at least 32 random bytes}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_TOKEN_ENCRYPTION_KEY: ${GITHUB_TOKEN_ENCRYPTION_KEY:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:5174/api/github/callback}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5174}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5174}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      INDEXING_MAX_FILE_SIZE_BYTES: ${INDEXING_MAX_FILE_SIZE_BYTES:-500000}
      INDEXING_CHUNK_LINES: ${INDEXING_CHUNK_LINES:-100}
      INDEXING_CHUNK_OVERLAP_LINES: ${INDEXING_CHUNK_OVERLAP_LINES:-15}
      INDEXING_MAX_FILES: ${INDEXING_MAX_FILES:-20000}
      INDEXING_MAX_TOTAL_BYTES: ${INDEXING_MAX_TOTAL_BYTES:-50000000}
      INDEXING_MAX_LINE_LENGTH: ${INDEXING_MAX_LINE_LENGTH:-20000}
      INDEXING_MAX_CHUNKS: ${INDEXING_MAX_CHUNKS:-100000}
      INDEXING_MAX_JOB_SECONDS: ${INDEXING_MAX_JOB_SECONDS:-1800}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-50}
      EMBEDDING_MAX_RETRIES: ${EMBEDDING_MAX_RETRIES:-3}
      EMBEDDING_RETRY_DELAY_MILLIS: ${EMBEDDING_RETRY_DELAY_MILLIS:-500}
      CHAT_PROVIDER: ${CHAT_PROVIDER:-openai}
      CHAT_BASE_URL: ${CHAT_BASE_URL:-https://api.openai.com/v1}
      CHAT_MODEL: ${CHAT_MODEL:-gpt-5-mini}
      CHAT_TIMEOUT_SECONDS: ${CHAT_TIMEOUT_SECONDS:-60}
      RAG_TOP_K: ${RAG_TOP_K:-8}
      RAG_MAX_CONTEXT_CHARS: ${RAG_MAX_CONTEXT_CHARS:-30000}
      RAG_MAX_QUESTION_CHARS: ${RAG_MAX_QUESTION_CHARS:-4000}
      CHAT_MAX_RETRIES: ${CHAT_MAX_RETRIES:-2}
      CHAT_RETRY_DELAY_MILLIS: ${CHAT_RETRY_DELAY_MILLIS:-250}
      ARCHITECTURE_MAX_FILES: ${ARCHITECTURE_MAX_FILES:-300}
      ARCHITECTURE_MAX_SOURCE_CHARS: ${ARCHITECTURE_MAX_SOURCE_CHARS:-3000000}
      ARCHITECTURE_MAX_COMPONENTS: ${ARCHITECTURE_MAX_COMPONENTS:-1000}
      ARCHITECTURE_MAX_RELATIONSHIPS: ${ARCHITECTURE_MAX_RELATIONSHIPS:-3000}
      ARCHITECTURE_ASK_MAX_QUESTION_CHARS: ${ARCHITECTURE_ASK_MAX_QUESTION_CHARS:-4000}
      ARCHITECTURE_ASK_MAX_COMPONENTS: ${ARCHITECTURE_ASK_MAX_COMPONENTS:-24}
      ARCHITECTURE_ASK_MAX_RELATIONSHIPS: ${ARCHITECTURE_ASK_MAX_RELATIONSHIPS:-40}
      ARCHITECTURE_ASK_DEPTH: ${ARCHITECTURE_ASK_DEPTH:-1}
      ARCHITECTURE_ASK_MAX_DEPTH: ${ARCHITECTURE_ASK_MAX_DEPTH:-2}
      ARCHITECTURE_ASK_TOP_K: ${ARCHITECTURE_ASK_TOP_K:-8}
      ARCHITECTURE_ASK_MAX_CHUNKS: ${ARCHITECTURE_ASK_MAX_CHUNKS:-12}
      ARCHITECTURE_ASK_MAX_CONTEXT_CHARS: ${ARCHITECTURE_ASK_MAX_CONTEXT_CHARS:-30000}
      REVIEW_MAX_FILES: ${REVIEW_MAX_FILES:-12}
      REVIEW_MAX_DIFF_CHARS: ${REVIEW_MAX_DIFF_CHARS:-40000}
      REVIEW_MAX_RETRIEVED_CHUNKS: ${REVIEW_MAX_RETRIEVED_CHUNKS:-24}
      REVIEW_MAX_TOTAL_CONTEXT_CHARS: ${REVIEW_MAX_TOTAL_CONTEXT_CHARS:-80000}
      REVIEW_MAX_BATCH_CHARS: ${REVIEW_MAX_BATCH_CHARS:-16000}
      REVIEW_MAX_BATCHES: ${REVIEW_MAX_BATCHES:-8}
      REVIEW_MAX_FINDINGS: ${REVIEW_MAX_FINDINGS:-40}
      REVIEW_MAX_SECONDS: ${REVIEW_MAX_SECONDS:-300}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8083}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12

  frontend:
    build:
      context: ./frontend
      args:
        VITE_AI_MAX_QUESTION_CHARS: ${RAG_MAX_QUESTION_CHARS:-4000}
    image: devpilot-frontend:1.1.0
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5174}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  devpilot_data:
    name: devpilot_data
